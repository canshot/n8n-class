version: '3.8'

services:
  dev-machine:
    image: ://microsoft.com
    volumes:
      # 현재 .devcontainer의 상위 폴더(루트)를 컨테이너의 /workspace에 확실하게 연결합니다.
      - ..:/workspace:cached

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    # dev-machine과 동일한 네트워크망을 쓰도록 묶어줍니다.
    network_mode: "service:dev-machine"

volumes:
  n8n_data:
