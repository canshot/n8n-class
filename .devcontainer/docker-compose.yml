version: '3.8'

services:
  # 1. VS Code 서버가 안전하게 구동될 표준 개발 머신
  dev-machine:
    image: ://microsoft.com
    volumes:
      - ..:/workspace:cached
    network_mode: service:n8n # n8n과 네트워크를 공유하여 포트를 연동합니다.

  # 2. 실제 n8n 서비스
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data: